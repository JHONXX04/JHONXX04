<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jhon de Jesús Ortega Pérez">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
      <animate attributeName="x1" values="0;1;0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;1;0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="brillo" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#9fe3ff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1.4" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>

    <filter id="difuso" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#fondo)"/>

  <ellipse cx="420" cy="150" rx="420" ry="150" fill="url(#halo)" filter="url(#difuso)">
    <animate attributeName="cx" values="380;820;380" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#7fd4ff">
    <circle cx="180" cy="90" r="2.5" opacity="0.7">
      <animate attributeName="cy" values="90;70;90" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="200" r="3" opacity="0.6">
      <animate attributeName="cy" values="200;170;200" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="235" r="2" opacity="0.5">
      <animate attributeName="cy" values="235;215;235" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="70" r="2" opacity="0.5">
      <animate attributeName="cy" values="70;50;70" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="0.5">Jhon de Jesús Ortega Pérez</text>
  <text x="600" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="url(#brillo)" letter-spacing="0.5">Jhon de Jesús Ortega Pérez</text>

  <text x="600" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8ecae6" letter-spacing="4">@JHONXX04</text>
  <text x="600" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#a8c7d8" letter-spacing="2">INGENIERO DE SISTEMAS</text>
</svg>
